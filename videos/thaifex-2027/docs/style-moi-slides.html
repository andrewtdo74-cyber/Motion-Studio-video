:root{--bg:#FAFAF8;--ink:#2B2D31;--mute:#6B6E75;--line:#DCDAD5;--soft:#ECEDEE;--red:#9B2335;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D9D7D2;font-family:"Source Sans 3",sans-serif;color:var(--ink);padding:24px 16px 80px}

.s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg)}

.step{color:var(--red);font-weight:600;font-size:26px;width:150px}

.a{position:absolute}
.h2{font:500 58px/1.35 "Noto Serif",serif}
.h3{font:500 44px/1.3 "Noto Serif",serif}
.body{font-size:38px;line-height:1.5}
.sub{font-size:31px;color:var(--mute)}
.rule{width:66px;height:5px;background:var(--red)}
.vline{position:absolute;width:2px;background:var(--line)}
.list .it{display:flex;gap:46px;align-items:baseline;border-bottom:2px solid var(--line);padding:22px 0}
.list .n{color:var(--red);font-size:27px;width:30px;flex:none}
.list .t{font-size:38px}
.plain .it{border-bottom:2px solid var(--line);padding:18px 0;font-size:38px}
.box{display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--mute);background:var(--soft)}
.box.on{background:var(--red);color:#fff}
.ph{background:#E9E8E5;display:flex;align-items:center;justify-content:center}
.phc{font-size:22px;color:var(--mute);margin-top:14px}
.tag{font-size:24px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.num{font:500 120px "Noto Serif",serif;color:var(--red);line-height:1}
.note{color:var(--red);font-size:30px}

const booth='<svg width="650" height="450" viewBox="0 0 650 450"><rect x="0" y="0" width="650" height="12" fill="#C9CBCF"/><rect x="0" y="0" width="14" height="410" fill="#C9CBCF"/><rect x="636" y="0" width="14" height="410" fill="#C9CBCF"/><rect x="14" y="12" width="622" height="398" fill="#fff"/><rect x="42" y="14" width="566" height="70" fill="#fff" stroke="#E3E1DC" stroke-width="3"/><rect x="42" y="14" width="566" height="7" fill="#C49A4E"/><text x="70" y="62" font-family="Source Sans 3" font-weight="700" font-size="30" fill="#2B2D31">COMPANY NAME</text><text x="580" y="62" text-anchor="end" font-family="Source Sans 3" font-weight="700" font-size="20" fill="#2B2D31">NO.00</text><line x1="218" y1="84" x2="218" y2="405" stroke="#E3E1DC" stroke-width="3"/><line x1="430" y1="84" x2="430" y2="405" stroke="#E3E1DC" stroke-width="3"/><rect x="366" y="178" width="206" height="12" rx="6" fill="#E2DACB"/><rect x="366" y="258" width="206" height="12" rx="6" fill="#E2DACB"/><rect x="90" y="288" width="112" height="102" rx="6" fill="#F7F6F3" stroke="#D7D3CB" stroke-width="3"/><circle cx="182" cy="340" r="5" fill="#9EA2A8"/><ellipse cx="324" cy="330" rx="56" ry="13" fill="#fff" stroke="#BDB9B1" stroke-width="3"/><rect x="320" y="332" width="8" height="56" fill="#BDB9B1"/><ellipse cx="324" cy="392" rx="26" ry="6" fill="#BDB9B1"/><rect x="0" y="405" width="650" height="45" fill="#B9B5AD"/></svg>';
const deck=document.getElementById('deck');
document.getElementById('t').content.querySelectorAll('section').forEach((sec,i)=>{
  const w=document.createElement('div'); w.className='wrap';
  w.innerHTML=`<div class="cap">${String(i+1).padStart(2,'0')} · ${sec.dataset.cap}</div><div class="frame"><div class="s"></div></div>`;
  const s=w.querySelector('.s'); s.innerHTML=sec.innerHTML;
  const st=sec.dataset.step;
  if(st&&st!=='0'){ s.insertAdjacentHTML('afterbegin',`<div class="hd"><span class="step">BƯỚC 0${st}</span><span class="ttl">${sec.dataset.ttl}</span><span class="brand">THAIFEX 2027</span></div>`); }
  if(st!==undefined){ s.insertAdjacentHTML('beforeend','<div class="ft">'+steps.map((n,k)=>`<span class="${k+1==st?'on':''}"><b>0${k+1}</b>${n}</span>`).join('')+'</div>'); }
  s.querySelectorAll('.booth').forEach(b=>b.innerHTML=booth);
  deck.appendChild(w);
});
const one=parseInt(location.hash.slice(1));
if(one){document.body.style.cssText='margin:0;padding:0;background:#FAFAF8';document.querySelector('.top').remove();document.querySelectorAll('.wrap').forEach((w,i)=>{if(i+1!==one)w.remove();else{w.style.cssText='margin:0;max-width:none';w.querySelector('.cap').remove();const f=w.querySelector('.frame');f.style.cssText='width:1920px;height:1080px;box-shadow:none';}});}
const fit=()=>document.querySelectorAll('.frame').forEach(f=>{f.firstElementChild.style.transform=`scale(${f.clientWidth/1920})`});
addEventListener('resize',fit); fit();
</script>
